[package]
name = "tracing-dinhani"
version = "0.1.0"
edition = "2024"
description = "Installs a tracing subscriber with pipe-separated fixed-width columns and colored key=value fields"
license = "MIT"

[dependencies]
nu-ansi-term = "0.50"
tracing-core = "0.1"
tracing-subscriber = { version = "0.3", features = ["chrono", "env-filter"] }

[dev-dependencies]
tracing = "0.1"
